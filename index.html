<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>తెలుగు పదవినోదం | Telugu Crossword</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1b5e20" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mandali&family=Ramabhadra&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #2e7d32;
      --primary-soft: #e8f5e9;
      --accent: #f59e0b;
      --accent-active: #fbbf24;
      --bg: #eceff1;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --cell-border: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Mandali', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      min-height: 92vh;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      border: 3px solid #e2e8f0;
      position: relative;
      overflow: hidden;
    }

    /* Top Navigation */
    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f8fafc;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 26px;
    }

    .brand-title {
      font-family: 'Ramabhadra', sans-serif;
      font-size: 1.15rem;
      color: var(--primary);
      line-height: 1.2;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      background: #ffffff;
      padding: 4px 8px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
    }

    /* Akshara Mitra Companion */
    .companion-banner {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
      border: 2px solid #81c784;
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.08);
      cursor: pointer;
    }

    .companion-avatar {
      font-size: 32px;
      animation: gentleBounce 2.5s infinite ease-in-out;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .companion-speech {
      flex: 1;
      font-size: 0.92rem;
      line-height: 1.35;
      color: #1b5e20;
      font-weight: 700;
    }

    .voice-chip {
      background: #1b5e20;
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Clue Selector Tabs */
    .clue-nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      width: 100%;
    }

    .clue-tab {
      flex: 1;
      padding: 6px 8px;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .clue-tab.active {
      background: #1b5e20;
      color: #ffffff;
      border-color: #1b5e20;
    }

    /* Crossword Stage */
    .game-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
      flex: 1;
    }

    .grid-board {
      display: inline-grid;
      gap: 6px;
      background: #e2e8f0;
      padding: 10px;
      border-radius: 20px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08), 0 6px 16px rgba(0,0,0,0.06);
      border: 2px solid #cbd5e1;
    }

    .grid-cell {
      width: 60px;
      height: 60px;
      background: #ffffff;
      border: 2.5px solid var(--cell-border);
      border-bottom-width: 4px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      font-family: 'Ramabhadra', sans-serif;
      color: #0f172a;
      cursor: pointer;
      position: relative;
      transition: all 0.12s ease;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
    }

    .grid-cell.active-word {
      background: #fffbeb;
      border-color: #fbbf24;
    }

    .grid-cell.selected {
      background: #ffffff !important;
      border-color: #1b5e20 !important;
      box-shadow: 0 0 0 4px rgba(27, 94, 32, 0.3), 0 4px 8px rgba(0,0,0,0.15);
      transform: translateY(-2px) scale(1.05);
      z-index: 5;
    }

    .grid-cell.solved {
      background: #e8f5e9 !important;
      color: #1b5e20 !important;
      border-color: #4caf50 !important;
      border-bottom-width: 2.5px;
    }

    .grid-cell.blocked {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      cursor: default !important;
    }

    .cell-badge {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 0.65rem;
      font-family: 'Ramabhadra', sans-serif;
      color: #64748b;
      line-height: 1;
      pointer-events: none;
    }

    /* Active Clue Bar */
    .clue-panel {
      width: 100%;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .clue-dir-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #1b5e20;
      background: #e8f5e9;
      padding: 2px 6px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 2px;
    }

    .clue-text {
      font-size: 1.02rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }

    .hint-btn {
      background: #fffbeb;
      color: #b45309;
      border: 2px solid #fde68a;
      padding: 6px 10px;
      border-radius: 12px;
      font-family: 'Mandali', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hint-btn:active {
      transform: scale(0.96);
    }

    /* Keyboard Palette */
    .palette-box {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .palette-key {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-bottom: 4px solid #94a3b8;
      border-radius: 14px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-family: 'Ramabhadra', sans-serif;
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.06);
      transition: all 0.08s ease;
      touch-action: manipulation;
    }

    .palette-key:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    /* Control Tray */
    .controls-tray {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-family: 'Mandali', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .action-btn:active {
      background: #e2e8f0;
    }

    /* Victory Modal */
    .modal-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 28px;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.25);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .stars-row {
      font-size: 32px;
      margin: 10px 0;
      color: #fbbf24;
      text-shadow: 0 2px 4px rgba(251, 191, 36, 0.3);
    }

    .next-lvl-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-family: 'Ramabhadra', sans-serif;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 12px rgba(27, 94, 32, 0.3);
    }

    .next-lvl-btn:active {
      background: var(--primary-light);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">

    <!-- Header -->
    <header>
      <div class="brand">
        <span class="brand-icon">🦜</span>
        <div class="brand-title">తెలుగు పదవినోదం</div>
      </div>
      <div class="stats-bar">
        <div class="stat-badge">🔥 <span id="streak-num">1</span></div>
        <div class="stat-badge">⭐ <span id="score-num">0</span></div>
        <div class="stat-badge" style="background:#e8f5e9; color:#1b5e20;">స్థాయి <span id="lvl-num">1</span></div>
      </div>
    </header>

    <!-- Akshara Mitra Companion Box -->
    <div class="companion-banner" onclick="speakCompanion()">
      <div class="companion-avatar">🦜</div>
      <div class="companion-speech" id="companion-text">
        నమస్కారం! అడ్డం లేదా నిలువు సూచనను ఎంచుకోండి.
      </div>
      <button class="voice-chip" type="button">🔊 విను</button>
    </div>

    <!-- Clue Selection Tabs -->
    <div class="clue-nav-bar" id="clue-nav-bar"></div>

    <!-- Crossword Playing Grid -->
    <main class="game-area">
      <div class="grid-board" id="puzzle-grid"></div>
    </main>

    <!-- Active Clue Card -->
    <div class="clue-panel">
      <div>
        <div class="clue-dir-tag" id="clue-direction">అడ్డం (1)</div>
        <div class="clue-text" id="clue-content">సూచన లోడ్ అవుతోంది...</div>
      </div>
      <button class="hint-btn" onclick="useHint()">
        💡 సహాయం
      </button>
    </div>

    <!-- Letter Keyboard Palette -->
    <div class="palette-box" id="letters-keyboard"></div>

    <!-- Bottom Controls -->
    <div class="controls-tray">
      <button class="action-btn" onclick="eraseCurrentCell()">⌫ తొలగించు</button>
      <button class="action-btn" onclick="toggleVoice()">🔊 <span id="voice-label">వాయిస్ ఆన్</span></button>
    </div>

    <!-- Victory Modal -->
    <div class="modal-backdrop" id="victory-modal">
      <div class="modal-card">
        <div style="font-size: 52px;">🏆</div>
        <h2 style="font-family:'Ramabhadra',sans-serif; color: #1b5e20; margin-top: 6px;">అద్భుతం!</h2>
        <p style="color: #64748b; font-size: 0.95rem;">ఈ స్థాయిని విజయవంతంగా పూర్తి చేశారు!</p>
        <div class="stars-row">⭐⭐⭐</div>
        <div style="background: #f8fafc; border-radius: 12px; padding: 10px; margin: 8px 0; font-size: 0.95rem; color: #334155;">
          +100 పాయింట్లు లభించాయి!
        </div>
        <button class="next-lvl-btn" onclick="nextLevel()">తదుపరి స్థాయి ➔</button>
      </div>
    </div>

  </div>

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'tap') {
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(960, now + 0.07);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + idx * 0.1);
          g.gain.setValueAtTime(0.18, now + idx * 0.1);
          g.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
          o.start(now + idx * 0.1);
          o.stop(now + idx * 0.1 + 0.25);
        });
      }
    }

    // Bite-Sized Level Packs
    const LEVELS_DB = [
      {
        level: 1,
        gridSize: 3,
        words: [
          { num: 1, word: ['క', 'మ', 'ల'], dir: 'H', r: 1, c: 0, clue: 'ఒక అందమైన చెరువు పువ్వు (తామర)', hint: 'దీనిని పద్మం అని కూడా పిలుస్తారు' },
          { num: 2, word: ['మ', 'న', 'సు'], dir: 'V', r: 1, c: 1, clue: 'భావాలు పుట్టే ప్రదేశం / హృదయం', hint: 'కోరికలు, ఆలోచనలు ఇక్కడే కలుగుతాయి' }
        ]
      },
      {
        level: 2,
        gridSize: 4,
        words: [
          { num: 1, word: ['గో', 'దా', 'వ', 'రి'], dir: 'H', r: 1, c: 0, clue: 'తెలుగు నేలపై ప్రవహించే పవిత్ర నది', hint: 'దక్షిణ గంగ అని పేరు' },
          { num: 2, word: ['భా', 'ను', 'డు'], dir: 'V', r: 0, c: 2, clue: 'పగలు వెలుగునిచ్చే సూర్యుడు', hint: 'రవి, భాస్కరుడు అని కూడా అంటారు' }
        ]
      },
      {
        level: 3,
        gridSize: 4,
        words: [
          { num: 1, word: ['పు', 'స్త', 'కం'], dir: 'H', r: 1, c: 0, clue: 'జ్ఞానాన్ని అందించే గ్రంథం', hint: 'చదువుకోవడానికి ఉపయోగపడుతుంది' },
          { num: 2, word: ['క', 'లం'], dir: 'V', r: 1, c: 2, clue: 'రాయడానికి వాడే సాధనం', hint: 'సిరాతో రాసే పరికరం' }
        ]
      },
      {
        level: 4,
        gridSize: 4,
        words: [
          { num: 1, word: ['జా', 'బి', 'లి'], dir: 'H', r: 1, c: 0, clue: 'రాత్రి వేళ ఆకాశంలో మెరిసే చందమామ', hint: 'చల్లని వెన్నెల కురిపిస్తాడు' },
          { num: 2, word: ['బి', 'య్యం'], dir: 'V', r: 1, c: 1, clue: 'అన్నం వండటానికి ఉపయోగించే ధాన్యం', hint: 'వరి నుంచి వస్తుంది' }
        ]
      },
      {
        level: 5,
        gridSize: 4,
        words: [
          { num: 1, word: ['తె', 'లు', 'గు'], dir: 'H', r: 1, c: 0, clue: 'తేనె వంటి మన మాతృభాష', hint: 'ఇటాలియన్ ఆఫ్ ది ఈస్ట్ అని పిలుస్తారు' },
          { num: 2, word: ['గు', 'డి'], dir: 'V', r: 1, c: 2, clue: 'దేవుడిని దర్శించుకునే పవిత్ర స్థలం', hint: 'కోవెల అని కూడా అంటారు' }
        ]
      }
    ];

    let currentLvlIdx = 0;
    let score = 0;
    let streak = 1;
    let selectedCell = null;
    let activeWord = null;
    let gridState = {};
    let voiceEnabled = true;
    let availableVoices = [];

    // Ensure voices load properly across Chrome / Android / Safari
    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function initLevel() {
      const lvl = LEVELS_DB[currentLvlIdx % LEVELS_DB.length];
      document.getElementById('lvl-num').textContent = lvl.level;
      document.getElementById('score-num').textContent = score;
      document.getElementById('streak-num').textContent = streak;

      // Render Clue Selector Tabs
      const navBar = document.getElementById('clue-nav-bar');
      navBar.innerHTML = '';
      lvl.words.forEach((w) => {
        const tab = document.createElement('div');
        tab.className = 'clue-tab';
        tab.id = `tab-${w.num}`;
        tab.textContent = `${w.num}. ${w.dir === 'H' ? 'అడ్డం' : 'నిలువు'}`;
        tab.onclick = () => selectWordDirectly(w);
        navBar.appendChild(tab);
      });

      const container = document.getElementById('puzzle-grid');
      container.innerHTML = '';
      container.style.gridTemplateColumns = `repeat(${lvl.gridSize}, 60px)`;
      gridState = {};

      const cellWordMap = {};
      const cellStartNum = {};

      lvl.words.forEach((w) => {
        const startKey = `${w.r}_${w.c}`;
        cellStartNum[startKey] = w.num;

        for (let i = 0; i < w.word.length; i++) {
          const r = w.dir === 'H' ? w.r : w.r + i;
          const c = w.dir === 'H' ? w.c + i : w.c;
          const key = `${r}_${c}`;
          if (!cellWordMap[key]) cellWordMap[key] = [];
          cellWordMap[key].push(w);
          gridState[key] = { expected: w.word[i], current: '', solved: false };
        }
      });

      for (let r = 0; r < lvl.gridSize; r++) {
        for (let c = 0; c < lvl.gridSize; c++) {
          const key = `${r}_${c}`;
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.key = key;

          if (gridState[key]) {
            if (cellStartNum[key]) {
              const badge = document.createElement('span');
              badge.className = 'cell-badge';
              badge.textContent = cellStartNum[key];
              cell.appendChild(badge);
            }
            cell.onclick = () => onCellClicked(key, cellWordMap[key]);
          } else {
            cell.classList.add('blocked');
          }
          container.appendChild(cell);
        }
      }

      setupKeyboard(lvl);
      selectWordDirectly(lvl.words[0]);
    }

    function selectWordDirectly(word) {
      activeWord = word;
      const startKey = `${word.r}_${word.c}`;
      highlightBoard(startKey);
    }

    function onCellClicked(key, wordsInCell) {
      // If clicking an intersection cell that belongs to both words, toggle between them!
      if (wordsInCell.length > 1 && activeWord) {
        const otherWord = wordsInCell.find(w => w.num !== activeWord.num);
        if (selectedCell === key && otherWord) {
          activeWord = otherWord;
        } else if (!wordsInCell.some(w => w.num === activeWord.num)) {
          activeWord = wordsInCell[0];
        }
      } else if (wordsInCell.length === 1) {
        activeWord = wordsInCell[0];
      }
      highlightBoard(key);
    }

    function highlightBoard(key) {
      selectedCell = key;

      // Update Clue Box
      document.getElementById('clue-direction').textContent = `${activeWord.dir === 'H' ? 'అడ్డం' : 'నిలువు'} (${activeWord.num})`;
      document.getElementById('clue-content').textContent = activeWord.clue;

      // Update Nav Tabs
      document.querySelectorAll('.clue-tab').forEach(tab => tab.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${activeWord.num}`);
      if (activeTab) activeTab.classList.add('active');

      // Highlight active word cells
      document.querySelectorAll('.grid-cell').forEach(c => {
        c.classList.remove('selected', 'active-word');
        if (activeWord) {
          for (let i = 0; i < activeWord.word.length; i++) {
            const r = activeWord.dir === 'H' ? activeWord.r : activeWord.r + i;
            const c = activeWord.dir === 'H' ? activeWord.c + i : activeWord.c;
            if (c.dataset.key === `${r}_${c}`) {
              c.classList.add('active-word');
            }
          }
        }
      });

      const cellEl = document.querySelector(`.grid-cell[data-key="${key}"]`);
      if (cellEl) cellEl.classList.add('selected');
      playChime('tap');

      // Akshara Mitra announces the clue
      setCompanionText(`${activeWord.num}. ${activeWord.clue}`);
    }

    function setupKeyboard(lvl) {
      const palette = document.getElementById('letters-keyboard');
      palette.innerHTML = '';
      const letters = [];
      lvl.words.forEach(w => letters.push(...w.word));
      
      const distractors = ['రా', 'సి', 'కం', 'తా', 'మ', 'న', 'లి', 'డి'];
      while (letters.length < 8) {
        letters.push(distractors[letters.length % distractors.length]);
      }
      letters.sort(() => Math.random() - 0.5);

      letters.forEach(letter => {
        const key = document.createElement('button');
        key.className = 'palette-key';
        key.textContent = letter;
        key.onclick = () => inputLetter(letter);
        palette.appendChild(key);
      });
    }

    function inputLetter(char) {
      if (!selectedCell || !gridState[selectedCell]) return;
      gridState[selectedCell].current = char;
      const cellEl = document.querySelector(`.grid-cell[data-key="${selectedCell}"]`);
      
      let badge = cellEl.querySelector('.cell-badge');
      cellEl.textContent = char;
      if (badge) cellEl.appendChild(badge);

      playChime('tap');
      checkWordCompletion();
      advanceFocus();
    }

    function eraseCurrentCell() {
      if (!selectedCell || !gridState[selectedCell]) return;
      gridState[selectedCell].current = '';
      const cellEl = document.querySelector(`.grid-cell[data-key="${selectedCell}"]`);
      let badge = cellEl.querySelector('.cell-badge');
      cellEl.textContent = '';
      if (badge) cellEl.appendChild(badge);
      playChime('tap');
    }

    function advanceFocus() {
      if (!activeWord) return;
      const [r, c] = selectedCell.split('_').map(Number);
      const nextR = activeWord.dir === 'H' ? r : r + 1;
      const nextC = activeWord.dir === 'H' ? c + 1 : c;
      const nextKey = `${nextR}_${nextC}`;
      if (gridState[nextKey]) {
        highlightBoard(nextKey);
      }
    }

    function checkWordCompletion() {
      let allCorrect = true;

      for (const [key, val] of Object.entries(gridState)) {
        if (val.current === val.expected) {
          const el = document.querySelector(`.grid-cell[data-key="${key}"]`);
          if (el) el.classList.add('solved');
        } else {
          allCorrect = false;
        }
      }

      if (allCorrect) {
        triggerVictory();
      }
    }

    function triggerVictory() {
      playChime('win');
      if (window.confetti) {
        window.confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 } });
      }
      score += 100;
      document.getElementById('score-num').textContent = score;
      document.getElementById('victory-modal').style.display = 'flex';
      setCompanionText('అద్భుతం! స్థాయి పూర్తయింది. మీరు విజయం సాధించారు!');
    }

    function nextLevel() {
      document.getElementById('victory-modal').style.display = 'none';
      currentLvlIdx++;
      initLevel();
    }

    function useHint() {
      if (!activeWord) return;
      setCompanionText(`💡 సహాయం: ${activeWord.hint}`);
    }

    // High-Reliability Voice Engine with Multi-Voice Fallback
    function setCompanionText(txt) {
      document.getElementById('companion-text').textContent = txt;
      if (!voiceEnabled || !('speechSynthesis' in window)) return;

      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(txt);
        utter.rate = 0.9;
        utter.pitch = 1.0;

        if (availableVoices.length === 0) {
          availableVoices = window.speechSynthesis.getVoices();
        }

        // Match Telugu voice first, then Indian Hindi/English voice fallback
        const teluguVoice = availableVoices.find(v => v.lang.includes('te') || v.lang.includes('TE'));
        const indianVoice = availableVoices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));

        if (teluguVoice) {
          utter.voice = teluguVoice;
          utter.lang = teluguVoice.lang;
        } else if (indianVoice) {
          utter.voice = indianVoice;
          utter.lang = indianVoice.lang;
        } else {
          utter.lang = 'te-IN';
        }

        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn('SpeechSynthesis error:', e);
      }
    }

    function speakCompanion() {
      // First user tap unlocks browser audio policy
      if (audioCtx.state === 'suspended') audioCtx.resume();
      loadVoices();
      const txt = document.getElementById('companion-text').textContent;
      setCompanionText(txt);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voice-label').textContent = voiceEnabled ? 'వాయిస్ ఆన్' : 'వాయిస్ ఆఫ్';
      if (voiceEnabled) {
        speakCompanion();
      } else {
        window.speechSynthesis.cancel();
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    initLevel();
  </script>
</body>
</html>
